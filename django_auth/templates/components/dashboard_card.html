<div class="card shadow-sm h-100">
    <div class="card-body">
        <h3 class="card-title text-uppercase ls-1 text-muted small mb-3">{{ title }}</h3>
        <div class="d-flex align-items-baseline">
            <div class="h1 mb-0 me-2 fw-bold" style="color: #880e4f;">{{ value }}</div>
            {% if subtitle %}
            <div class="me-auto">
                <span class="text-muted small">{{ subtitle }}</span>
            </div>
            {% endif %}
        </div>
        {% if chart_id %}
        <div class="mt-3" style="height: 200px;">
            <canvas id="{{ chart_id }}"></canvas>
        </div>
        {% endif %}
    </div>
</div>

{% load static %}

<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Управление заявками</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
</head>

<body>
<div class="page">
    <div class="page-wrapper">
        <div class="container-xl py-4">

            <h1 class="mb-4">Центр управления заявками</h1>
            
            <div class="mb-3">
                <a href="/profile/" class="btn btn-outline-secondary">
                    <i class="ti ti-arrow-left me-2"></i> На главную
                </a>
            </div>
            

            <div class="row row-cards mb-4">
    <div class="col-sm-6 col-lg-4">
        <div class="card">
            <div class="card-body">
                <div class="subheader">Всего заявок</div>
                <div class="h1 mb-3" id="stat-total">0</div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-lg-4">
        <div class="card">
            <div class="card-body">
                <div class="subheader">В работе</div>
                <div class="h1 mb-3 text-primary" id="stat-progress">0</div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-lg-4">
        <div class="card">
            <div class="card-body">
                <div class="subheader">Выполнено</div>
                <div class="h1 mb-3 text-success" id="stat-done">0</div>
            </div>
        </div>
    </div>
</div>

            {% csrf_token %}

            <div id="message" role="status"
                 aria-live="polite"></div>

            <div class="card mb-4">
                <div class="card-body">
                    <form id="ticket-form">
                        <div class="mb-3">
                            <label class="form-label">
                                Название заявки
                            </label>
                            <input id="title"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Категория
                            </label>
                            <select id="category"
                                    class="form-select"
                                    required></select>
                        </div>

                        <button class="btn btn-primary"
                                type="submit">
                            Создать заявку
                        </button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Список заявок</h2>
                </div>

                <div class="card-body">
                    <select id="status-filter"
                            class="form-select mb-3">
                        <option value="">Все статусы</option>
                        <option value="new">Новые</option>
                        <option value="progress">В работе</option>
                        <option value="done">Выполненные</option>
                    </select>

                    <div id="loading" hidden>
                        Загрузка данных...
                    </div>

                    <div id="tickets-list"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script src="{% static 'tickets/app.js' %}"></script>
</body>
</html>
